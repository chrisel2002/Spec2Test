name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc needs Next.js's generated route types (LayoutProps, PageProps, ...),
      # which normally only exist after `next dev`/`next build` has run once.
      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Lint
        run: pnpm exec eslint .

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test
