name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsc needs Next.js's generated route types (LayoutProps, PageProps, ...),
      # which normally only exist after `next dev`/`next build` has run once.
      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Lint
        run: pnpm exec eslint .

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

  # Tests that need a real Postgres (with pgvector): the MCP server tests
  # and the Playwright e2e tests. Both mock embeddings and the model (see
  # vitest.mcp.config.ts and playwright.config.ts), so no API keys or
  # secrets are needed.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spec2test
          POSTGRES_PASSWORD: spec2test
          POSTGRES_DB: spec2test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spec2test -d spec2test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://spec2test:spec2test@localhost:5432/spec2test_e2e
      MCP_TEST_DATABASE_URL: postgresql://spec2test:spec2test@localhost:5432/spec2test_mcp
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: MCP server tests
        run: pnpm test:mcp

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
